<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOOMSDAY PROTOCOL // Gate</title>
<meta name="description" content="Latverian Command Network. Unauthorized access will be answered by Doom.">
<meta name="theme-color" content="#050a03">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Russo+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #020604;
    --emerald: #7fe04a;
    --emerald-hi: #d6ff8f;
    --emerald-dim: #2e5c1c;
    --steel: #c3cec7;
    --steel-dim: #5f6d67;
    --crimson: #ff3b4e;
    --line: rgba(127, 224, 74, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--void); color: var(--steel);
    font-family: 'Share Tech Mono', ui-monospace, monospace;
  }
  .bg {
    position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2;
    filter: saturate(1.1) brightness(.35) blur(2px);
  }
  .scan {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.3) 0 1px, transparent 1px 3px);
  }
  .gate {
    position: relative; width: min(420px, 100%); text-align: center;
    padding: 36px 28px 30px; background: rgba(3,10,4,.82);
    border: 1px solid var(--line);
    box-shadow: inset 0 0 60px rgba(127,224,74,.06), 0 30px 80px rgba(0,0,0,.7);
  }
  .gate::before, .gate::after { content: ''; position: absolute; width: 22px; height: 22px; border: 2px solid var(--emerald); }
  .gate::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .gate::after  { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  .seal { font-family: 'Cinzel', serif; font-weight: 900; font-size: 44px; color: #f0fbe8; width: 76px; height: 76px; line-height: 72px; margin: 0 auto 14px; border: 2px solid var(--emerald); border-radius: 50%; text-shadow: 0 0 14px rgba(127,224,74,.7); box-shadow: 0 0 22px rgba(127,224,74,.35); }
  h1 { font-family: 'Russo One', sans-serif; font-weight: 400; font-size: 26px; letter-spacing: .12em; color: #f0fbe8; }
  .sub { margin: 8px 0 26px; font-size: 11px; letter-spacing: .35em; color: var(--emerald); }
  label { display: block; font-size: 11px; letter-spacing: .3em; color: var(--steel-dim); margin-bottom: 10px; }
  input {
    width: 100%; padding: 14px; text-align: center;
    font: 28px 'Share Tech Mono', monospace; letter-spacing: .6em; text-indent: .6em;
    color: var(--emerald-hi); background: rgba(0,0,0,.6);
    border: 1px solid var(--emerald-dim); outline: none;
  }
  input:focus { border-color: var(--emerald); box-shadow: 0 0 16px rgba(127,224,74,.35); }
  button {
    margin-top: 16px; width: 100%; padding: 13px; cursor: pointer;
    font: 14px 'Russo One', sans-serif; letter-spacing: .3em; color: #041004;
    background: linear-gradient(180deg, #b8f58a, #5fb83a); border: 0;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { filter: grayscale(.6); cursor: wait; }
  .denied { display: none; margin-top: 16px; font-size: 12px; letter-spacing: .25em; color: var(--crimson); }
  .denied.on { display: block; }
  .foot { margin-top: 22px; font-size: 10px; letter-spacing: .25em; color: var(--steel-dim); }
</style>
</head>
<body>
<img class="bg" src="/assets/latveria_throne.jpg" alt="" aria-hidden="true">
<div class="scan"></div>

<form class="gate" method="POST" action="/api/unlock" autocomplete="off">
  <div class="seal" aria-hidden="true">D</div>
  <h1>DOOMSDAY PROTOCOL</h1>
  <div class="sub">LATVERIAN COMMAND NETWORK</div>
  <label for="pin">SPEAK THE KEY</label>
  <input id="pin" name="pin" type="password" inputmode="numeric" maxlength="64" required autofocus>
  <button type="submit">ENTER</button>
  <div class="denied" id="denied" role="alert">▲ ACCESS DENIED · DOOM HAS NOTED YOUR ATTEMPT</div>
  <div class="foot">UNAUTHORIZED ACCESS WILL BE ANSWERED BY DOOM</div>
</form>

<script>
  if (new URLSearchParams(location.search).has('denied')) document.getElementById('denied').classList.add('on');
  document.querySelector('form').addEventListener('submit', e => { e.target.querySelector('button').disabled = true; });
</script>
</body>
</html>
